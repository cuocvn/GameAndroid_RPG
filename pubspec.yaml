name: game_and
description: "Vô Ảnh Chiến Ký - Offline Tactical Idle RPG"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#0D0B14"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#0D0B14"
    image: "assets/icon/splash_logo.png"
    icon_background_color: "#0D0B14"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/img/
    - assets/img/characters/
    - assets/img/equipment/
    - assets/img/monsters/
