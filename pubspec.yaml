name: game_and
description: "Offline Tactical Idle RPG in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/img/characters/
    - assets/img/equipment/
    - assets/img/monsters/
    - asset/img/
    - asset/img/characters/
    - asset/img/equipment/
    - asset/img/monsters/
